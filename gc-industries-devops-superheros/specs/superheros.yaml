# Endurance application spec — the INPUT to `endurance onboard --from`.
#
# apps/superheros/ is generated from this file and is overwritten on every
# onboard run, so a fix applied by hand there does not survive. Fix it here.
# (Phase 1 lost the namespace fix exactly that way: an onboard re-run against a
# stale ad-hoc spec silently reverted `superheros` to `superheros-lp`.)
#
#   endurance onboard --root . --from specs/superheros.yaml
#
# Images carry their registry host explicitly. Kubernetes would resolve a bare
# "dockergc00/..." against Docker Hub just fine, but the restrict-image-registries
# ClusterPolicy matches the literal string against "docker.io/*" — so an
# unqualified reference runs and is rejected at the same time.
#
# resources and security are omitted deliberately: Endurance materializes its
# platform defaults into apps/superheros/values.yaml, which is what the policy
# gate then validates. Set them here only to override a default.

name: superheros
namespace: superheros

# Where this application's own code lives. Recorded in the registry entry and
# never cloned — the platform builds no images and reads no application source.
# It is NOT the repo ArgoCD watches: that is the platform repo, passed as
# `--gitops-repo`, which defaults to this repo's origin remote. The two are both
# GitHub URLs and were named `repository:` and `--gitops-repo` until v0.12.0,
# which cost the first outside tester four edits of their own spec. `repository:`
# still parses and is warned about; Endurance writes this spelling.
#
# For superheros the two happen to be the same URL, because customer #1 still
# lives inside the platform repo. Phase 15 is where that stops being true.
sourceRepo: https://github.com/gc-ghub/project-gc-industries-devops-superheros.git
owner: gc-industries

# Istio. Required by catalog's weighted versions below: the weights are enforced
# by the caller's sidecar, so without the mesh they are inert and kube-proxy
# splits traffic evenly regardless of what this file says. Turning it on gives
# every pod in the namespace a sidecar and rolls all of them once.
mesh:
  enabled: true

# The application's public addresses.
#
# This is the whole of what superheros knows about being on the internet: a set
# of paths, and which of its five services answers each. Endurance renders them
# into one VirtualService bound to the platform's ingress Gateway
# (istio-system/endurance-gateway) and ArgoCD applies it — so the app is at
# http://localhost:8080/ with nothing running in a terminal.
#
# The route is here and not in the platform on purpose. The pre-Endurance
# superhero chart had /api/catalog written into a gateway route, which meant the
# platform could serve exactly one application. An application asks; the
# platform provides a door and does not look through it.
#
# Three routes, because this application has more than one front door and
# pretending it had one broke it.
#
# The browser is the caller here, not frontend. CatalogPage.jsx runs `fetch(
# "/api/catalog")` in the user's browser, so that request arrives at the
# platform's gateway exactly like the one for the page itself — it is not an
# in-mesh call from frontend, and no amount of mesh configuration makes it one.
# Before Endurance these four paths were rules in the app's own hand-written
# gateway route. The first Endurance onboarding replaced them with the single
# route the model then allowed, and the result deployed clean and healthy with
# four of its five doors bricked up: the home page rendered, /catalog hung on
# "Loading catalog…", and ArgoCD reported Synced throughout.
#
# So each path is written down, and nothing is published that is not written
# here. These are the paths the browser actually requests, read out of the
# frontend source rather than copied from the old chart:
#
#   CatalogPage.jsx   fetch("/api/catalog")   → catalog serves /api/catalog
#   PaymentPage.jsx   fetch("/api/pay")       → payment serves /pay
#
# `rewrite` is what closes the second gap. payment was written to answer /pay
# and is being called at /api/pay, and neither side is wrong — the prefix is a
# fact about where it is mounted, so the platform strips it.
#
# inventory and orders are deliberately NOT routed, and that is not an oversight:
#
#   - nothing in the frontend calls inventory at all.
#   - ordersApi.js calls http://localhost:8082/api/orders — a hardcoded host and
#     port, not a path on this platform. kind publishes 8080 and nothing else,
#     so that request fails in a browser no matter what is written here. It is
#     an application bug, and routing /api/orders would not fix it; it would
#     only publish a service nothing calls.
#
# The old hand-written chart routed all four, which is where the temptation to
# copy them comes from. Two of those four routes never carried a request.
#
# Order does not matter in this file. Endurance sorts routes longest-path-first
# before rendering them, because Istio takes the first prefix that matches and a
# `/` rule above `/api/catalog` would silently swallow it. The generated
# apps/superheros/values.yaml shows the order that will actually be used.
#
# `port` is omitted deliberately: it is read from the named service, so it
# cannot fall out of step with it. `path: /` is the root of the platform's one
# host; the platform's own dashboards keep /argocd, /kiali, /grafana,
# /prometheus and /alertmanager, and Endurance refuses a route that claims one.
routes:
  - path: /
    service: frontend
  - path: /api/catalog
    service: catalog
  - path: /api/pay
    service: payment
    rewrite: /pay

# Who hears about this application, and when.
#
# The stages split across the two halves of the platform, and the split is the
# point. `onboarded` and `requested` are sent by the CLI at the moment it writes
# these files — intent, nothing more; the commit may not even be pushed yet.
# `deploying`, `healthy` and `failed` are sent by ArgoCD from the cluster, and
# they are the only ones that can honestly say what happened, because ArgoCD is
# the only thing that deploys. `onboard` renders the ArgoCD half into
# apps/superheros/application.yaml as subscription annotations.
#
# `webhook` names a service the platform configured, never a URL — an
# incoming-webhook URL is a credential, and this file is pushed to GitHub.
# endurance-sink is the in-cluster JSON receiver, so this works on a laptop
# with no Slack account. For Slack, either point webhook at `slack-incoming`
# (an incoming-webhook URL, two minutes to set up) or set `slack: <channel>`
# (needs a bot token); see platform/gitops/argocd/values.slack.yaml.example.
#
# `stages` is omitted, which means all five. Narrowing it is how you stop being
# told your own deploys failed.
notify:
  enabled: true
  webhook: endurance-sink

services:
  # port 8080, not 80 (Phase 14's live regeneration proof found this): the
  # image already switched to nginxinc/nginx-unprivileged, but its own
  # nginx.conf still said `listen 80;`, so the container was still trying to
  # bind a privileged port as UID 10001 with no NET_BIND_SERVICE capability —
  # structurally impossible under this platform's mandatory security context,
  # on any machine, regardless of the base image. The new 14.4 image preflight
  # refused to regenerate this app until it was fixed here, in nginx.conf and
  # in the Dockerfile's EXPOSE line — a rebuild under a new tag is still
  # needed before this is live; v1-9c6f729 predates the fix.
  - name: frontend
    image: docker.io/dockergc00/superheros-frontend
    tag: v1-9c6f729
    port: 8080
    replicas: 1
  # catalog is the canary. Three versions of the same image run side by side
  # behind one Service; Istio decides which one serves each request. Note there
  # is no top-level tag or replicas here — those live on the versions, because a
  # service that runs three tags at once cannot honestly claim one.
  #
  # CATALOG_VERSION is what makes the split observable: the service echoes it
  # back in its JSON, so `curl /api/catalog` repeatedly shows the distribution.
  # The weight is deliberately NOT passed as an environment variable — doing so
  # would restart every pod on every weight change, which is exactly what
  # shifting traffic at the mesh layer exists to avoid.
  - name: catalog
    image: docker.io/dockergc00/superheros-catalog
    port: 8081
    versions:
      - name: v1
        tag: v1-6f11a5d
        weight: 30
        replicas: 1
        env:
          - name: CATALOG_VERSION
            value: v1
      - name: v2
        tag: v2-6f11a5d
        weight: 30
        replicas: 1
        env:
          - name: CATALOG_VERSION
            value: v2
      - name: v3
        tag: v3-6f11a5d
        weight: 40
        replicas: 1
        env:
          - name: CATALOG_VERSION
            value: v3
  - name: inventory
    image: docker.io/dockergc00/superheros-inventory
    tag: v1-b9b34bb
    port: 8083
    replicas: 1
  - name: orders
    image: docker.io/dockergc00/superheros-orders
    tag: v1-df408cf
    port: 8082
    replicas: 1
  - name: payment
    image: docker.io/dockergc00/superheros-payment
    tag: v1-6f11a5d
    port: 8084
    replicas: 1
