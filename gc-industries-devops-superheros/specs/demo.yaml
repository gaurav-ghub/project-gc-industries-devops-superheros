# demo — the INPUT to `endurance onboard --from`.
#
# Written by `endurance init`. apps/demo/ is generated from this file
# and overwritten on every onboard, so edit it here, not there:
#
#   endurance onboard --root . --from specs/demo.yaml
#
# resources and security are omitted on purpose — Endurance materialises its
# platform defaults (non-root UID 10001, all capabilities dropped, CPU/memory
# requests and limits) into apps/demo/values.yaml, which is what the
# Kyverno gate then validates. Set them here only to override a default.

name: demo
namespace: demo
owner: gc-ghub

# The application's public address. The platform owns one Istio Gateway and
# deliberately knows nothing about what is behind any path on it — an
# application asks, here, and charts/app renders a VirtualService bound to it.
# `port` is omitted so it is read from the named service and cannot drift.
# /argocd, /kiali, /grafana, /prometheus and /alertmanager are the platform's.
route:
  enabled: true
  path: /demo
  service: demo

# One service. An application is a set of independently-deployable services;
# this is the N=1 case. Add another entry here and re-run onboard to grow it.
services:
  - name: demo
    image: docker.io/nginxinc/nginx-unprivileged
    tag: stable-alpine
    port: 8080
    replicas: 1
