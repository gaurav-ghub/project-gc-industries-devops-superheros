server {
    # 8080, not 80. nginxinc/nginx-unprivileged runs as a non-root UID, and a
    # non-root process cannot bind a port below 1024 without the
    # NET_BIND_SERVICE capability, which Endurance's platform-mandated
    # security context drops along with every other one. Using the
    # unprivileged base image and then telling it to listen on 80 anyway
    # reintroduces the exact problem the base image exists to avoid.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ===== API PROXY (CORRECT WAY) =====
    location /api/ {
        proxy_pass http://payment.superheros.svc.cluster.local/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ===== SPA ROUTING =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== STATIC ASSETS =====
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ===== SECURITY HEADERS =====
    add_header X-Frame-Options "DENY";
    add_header X-Content-Type-Options "nosniff";
}