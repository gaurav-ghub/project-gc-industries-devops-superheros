apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: superheros
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: orders
  template:
    metadata:
      labels:
        app: orders
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: orders
          image: docker.io/dockergc00/superheros-orders:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: CATALOG_URL
              value: "http://catalog:8081"
            - name: INVENTORY_URL
              value: "http://inventory:8083"
            - name: PAYMENT_URL
              value: "http://payment:8084"
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10
