apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-v2
  namespace: superheros
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: catalog
      version: v2
  template:
    metadata:
      labels:
        app: catalog
        version: v2
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: catalog
        image: docker.io/dockergc00/superheros-catalog:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 8081
        env:
          - name: CATALOG_VERSION
            value: "v2"
        securityContext:
          allowPrivilegeEscalation: false
        resources:
          limits:
            cpu: "500m"
            memory: "256Mi"
          requests:
            cpu: "250m"
            memory: "128Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 10
