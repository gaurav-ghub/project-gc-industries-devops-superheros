# Alertmanager configuration for AI-powered alert routing

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig

metadata:
  name: slack-alerts
  namespace: superheros

spec:
  route:
    receiver: ai-webhook

    groupBy:
      - alertname
      - namespace

    groupWait: 10s
    groupInterval: 30s
    repeatInterval: 1h

    matchers:
      - name: severity
        value: warning
        matchType: "="

      - name: team
        value: platform
        matchType: "="

  receivers:
    - name: ai-webhook

      webhookConfigs:
        - url: "http://superhero-ai-alertmanager.monitoring.svc.cluster.local:8000/alerts"

          sendResolved: true
          