# Alertmanager configuration for AI-powered alert routing
#
# SUPERSEDED (Phase 6). This AlertmanagerConfig CR was never actually consumed:
# kube-prometheus-stack only merges an AlertmanagerConfig when the Alertmanager
# is told to select it (spec.alertmanagerConfigSelector), which the platform
# never set — so this route was inert. The platform now routes to the AI enricher
# from the MAIN Alertmanager config in
# platform/monitoring/values/kind/prometheus-values.yaml (always consumed).
# Kept here for reference only; do not rely on it to route anything.

apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig

metadata:
  name: slack-alerts
  namespace: superheros

spec:
  route:
    receiver: ai-webhook

    groupBy:
      - alertname
      - namespace

    groupWait: 10s
    groupInterval: 30s
    repeatInterval: 1h

    matchers:
      - name: severity
        value: warning
        matchType: "="

      - name: team
        value: platform
        matchType: "="

  receivers:
    - name: ai-webhook

      webhookConfigs:
        - url: "http://superhero-ai-alertmanager.monitoring.svc.cluster.local:8000/alerts"

          sendResolved: true
          