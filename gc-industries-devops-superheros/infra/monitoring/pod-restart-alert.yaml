apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-restart-alerts
  namespace: monitoring

spec:
  groups:
    - name: kubernetes-alerts
      rules:
        - alert: PodRestartingFrequently
          expr: increase(kube_pod_container_status_restarts_total[5m]) > 0 # Alert if there has been at least one restart in the last 5 minutes # counter metric, so we use increase() to get the number of restarts in the last 5 minutes
          for: 1m # Alert if the condition persists for 1 minute

          labels:
            severity: warning # Adjust severity as needed (e.g., warning, critical)

          annotations:
            summary: "Pod is restarting frequently"
            description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} restarted recently."