## Every application namespace, not one of them — see policy-01.yaml for why the
## `namespaces:` selector was removed in Phase 13 and what the exclude list is
## doing in its place.

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-team-label
spec:
  rules:
    - name: add-team-label
      match:
        resources:
          kinds:
            - Pod
      exclude:
        resources:
          namespaces:
            - kube-system
            - istio-system
            - kyverno
            - monitoring
            - argocd
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              team: platform