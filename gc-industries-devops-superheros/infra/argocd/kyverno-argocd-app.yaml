apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/gc-ghub/project-gc-industries-devops-superheros.git
    targetRevision: main
    path: gc-industries-devops-superheros/infra/kyverno_policy/
  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true