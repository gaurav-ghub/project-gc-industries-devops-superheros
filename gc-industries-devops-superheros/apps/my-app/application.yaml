apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 
      targetRevision: HEAD
      path: gc-industries-devops-superheros/charts/app
      helm:
        valueFiles:
          - $values/gc-industries-devops-superheros/apps/my-app/values.yaml
    - repoURL: 
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: my-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
