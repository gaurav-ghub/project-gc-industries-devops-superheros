# Endurance registry entry — do not edit by hand; use `endurance onboard`
---
name: bad-application
namespace: bad-application
repository: ""
owner: Gaurav Chaurasia
route:
    enabled: true
    path: /bad-application
    service: bad-application
    port: 8080
    gateway: istio-system/endurance-gateway
services:
    - name: bad-application
      image: docker.io/dockergc00/bad-app
      tag: v2
      port: 8080
      replicas: 1
      resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 512Mi
      security:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        allowPrivilegeEscalation: false
        dropCapabilities:
            - ALL
