# Values for charts/app — rendered by Endurance
---
app:
    name: bad-app
route:
    enabled: true
    path: /bad-app
    service: bad-app
    port: 8080
    gateway: istio-system/endurance-gateway
services:
    - name: bad-app
      image: docker.io/gauravghub/nothing-here
      tag: v9
      port: 8080
      replicas: 1
      resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 512Mi
      security:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        allowPrivilegeEscalation: false
        dropCapabilities:
            - ALL
