# Endurance registry entry — do not edit by hand; use `endurance onboard`
---
name: bad-app
namespace: bad-app
owner: Gaurav Chaurasia
mesh:
    enabled: true
route:
    enabled: true
    path: /bad-app
    service: bad-app
    port: 8080
    gateway: istio-system/endurance-gateway
services:
    - name: bad-app
      image: docker.io/dockergc00/bad-app
      tag: v2
      port: 8080
      replicas: 1
      resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 512Mi
      security:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        allowPrivilegeEscalation: false
        dropCapabilities:
            - ALL
