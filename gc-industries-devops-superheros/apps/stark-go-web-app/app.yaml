# Endurance registry entry — do not edit by hand; use `endurance onboard`
---
name: stark-go-web-app
namespace: stark-go-web-app
repository: ""
owner: Gaurav Chaurasia
route:
    enabled: true
    path: /stark-go-web-app
    service: stark-go-web-app
    port: 8080
    gateway: istio-system/endurance-gateway
services:
    - name: stark-go-web-app
      image: docker.io/dockergc00/stark-industries-go-web-app
      tag: v1
      port: 8080
      replicas: 1
      resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 512Mi
      security:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        allowPrivilegeEscalation: false
        dropCapabilities:
            - ALL
