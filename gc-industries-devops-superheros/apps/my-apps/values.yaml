# Values for charts/app — rendered by Endurance
---
app:
    name: my-apps
route:
    enabled: true
    path: /my-apps
    service: my-apps
    port: 8080
    gateway: istio-system/endurance-gateway
services:
    - name: my-apps
      image: docker.io/nginxinc/nginx-unprivileged
      tag: stable-alpine
      port: 8080
      replicas: 1
      resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 512Mi
      security:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        allowPrivilegeEscalation: false
        dropCapabilities:
            - ALL
