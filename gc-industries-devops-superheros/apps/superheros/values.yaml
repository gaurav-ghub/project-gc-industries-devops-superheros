# Values for charts/app — rendered by Endurance
---
app:
    name: superheros
mesh:
    enabled: true
routes:
    - enabled: true
      path: /api/catalog
      service: catalog
      port: 8081
      gateway: istio-system/endurance-gateway
    - enabled: true
      path: /api/pay
      service: payment
      rewrite: /pay
      port: 8084
      gateway: istio-system/endurance-gateway
    - enabled: true
      path: /
      service: frontend
      port: 80
      gateway: istio-system/endurance-gateway
services:
    - name: frontend
      image: docker.io/dockergc00/superheros-frontend
      tag: v1-9c6f729
      port: 80
      replicas: 1
      resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 512Mi
      security:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        allowPrivilegeEscalation: false
        dropCapabilities:
            - ALL
    - name: catalog
      image: docker.io/dockergc00/superheros-catalog
      port: 8081
      resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 512Mi
      security:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        allowPrivilegeEscalation: false
        dropCapabilities:
            - ALL
      versions:
        - name: v1
          tag: v1-6f11a5d
          weight: 30
          replicas: 1
          env:
            - name: CATALOG_VERSION
              value: v1
        - name: v2
          tag: v2-6f11a5d
          weight: 30
          replicas: 1
          env:
            - name: CATALOG_VERSION
              value: v2
        - name: v3
          tag: v3-6f11a5d
          weight: 40
          replicas: 1
          env:
            - name: CATALOG_VERSION
              value: v3
    - name: inventory
      image: docker.io/dockergc00/superheros-inventory
      tag: v1-b9b34bb
      port: 8083
      replicas: 1
      resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 512Mi
      security:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        allowPrivilegeEscalation: false
        dropCapabilities:
            - ALL
    - name: orders
      image: docker.io/dockergc00/superheros-orders
      tag: v1-df408cf
      port: 8082
      replicas: 1
      resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 512Mi
      security:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        allowPrivilegeEscalation: false
        dropCapabilities:
            - ALL
    - name: payment
      image: docker.io/dockergc00/superheros-payment
      tag: v1-6f11a5d
      port: 8084
      replicas: 1
      resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 500m
            memory: 512Mi
      security:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        allowPrivilegeEscalation: false
        dropCapabilities:
            - ALL
