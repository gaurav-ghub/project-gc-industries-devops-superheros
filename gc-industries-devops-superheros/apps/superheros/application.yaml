apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: superheros
  namespace: argocd
  # Who hears about this application, and when. The stages a developer can ask
  # for are Endurance's; the triggers below are ArgoCD's — because ArgoCD is the
  # only thing that deploys, and so the only thing that knows whether a deploy
  # worked. The onboarded and requested stages have no trigger here on purpose:
  # those are sent by the CLI, which knows intent and nothing more.
  annotations:
    notifications.argoproj.io/subscribe.on-deployed.endurance-sink: ""
    notifications.argoproj.io/subscribe.on-health-degraded.endurance-sink: ""
    notifications.argoproj.io/subscribe.on-sync-failed.endurance-sink: ""
    notifications.argoproj.io/subscribe.on-sync-running.endurance-sink: ""
spec:
  project: default
  sources:
    - repoURL: 
      targetRevision: HEAD
      path: gc-industries-devops-superheros/charts/app
      helm:
        valueFiles:
          - $values/gc-industries-devops-superheros/apps/superheros/values.yaml
    - repoURL: 
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: superheros
  syncPolicy:
    # Sidecar injection is a property of the namespace, and the namespace is
    # ArgoCD's to create — so the label that turns the mesh on belongs here
    # rather than in a kubectl command someone has to remember to run.
    managedNamespaceMetadata:
      labels:
        istio-injection: enabled
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
