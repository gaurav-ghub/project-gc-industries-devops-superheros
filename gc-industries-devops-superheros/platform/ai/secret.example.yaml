###############################################################################
# Template for the AI alertmanager's credentials.
#
#   cp secret.example.yaml secret.yaml     # secret.yaml is git-ignored
#   # fill in the two values, then:
#   kubectl apply -f secret.yaml            # or let install.sh apply it
#
# Both values ARE credentials, not pointers to credentials:
#   * OPENAI_API_KEY posts (and pays) on your OpenAI account.
#   * SLACK_WEBHOOK_URL lets anyone holding it post to your Slack channel.
# So the real file lives OUTSIDE git. The placeholders below use angle brackets
# on purpose — GitHub push protection matches the *shape* of a credential, and a
# realistic-looking dummy (learned the hard way in Phase 5) gets a push
# rejected. Do not "helpfully" replace them with realistic-looking values.
###############################################################################

apiVersion: v1
kind: Secret
metadata:
  name: superhero-ai-secret
  namespace: monitoring
type: Opaque
stringData:
  OPENAI_API_KEY: "<your-openai-api-key>"
  SLACK_WEBHOOK_URL: "<your-slack-incoming-webhook-url>"
