###############################################################################
# ArgoCD values — Endurance
#
# Everything below configures the *outcome* half of Endurance's developer
# notifications (Phase 5).
#
# The platform owns three things here: which notification services exist, what
# a message looks like, and which cluster conditions are worth a message. What
# it deliberately does NOT own is who receives them — that is per-application,
# declared in specs/<app>.yaml and rendered by `endurance onboard` into
# subscription annotations on apps/<app>/application.yaml.
#
# Why this half exists at all: the CLI knows a developer asked for something,
# and nothing more. Only ArgoCD deploys, so only ArgoCD can say whether the
# deploy worked. A CLI that printed "deployed" after writing a YAML file would
# be reporting a fact it cannot have.
#
# Author: Gaurav Chaurasia
###############################################################################

###############################################################################
# Serving ArgoCD from /argocd (Phase 10 — the access layer)
#
# ArgoCD is reached at http://localhost:8080/argocd, through the platform's
# Istio ingress gateway. Three settings, and each one is doing something
# different:
#
#   server.insecure   argocd-server serves HTTPS by default and redirects HTTP
#                     to it. Behind a gateway that already terminated the
#                     connection, that redirect is an infinite loop — the
#                     browser is on HTTP, the server insists on HTTPS, the
#                     gateway speaks HTTP to the pod. TLS ends at the gateway.
#
#   server.rootpath   tells argocd-server that its own URLs begin with /argocd,
#                     so its API and redirects are right.
#
#   server.basehref   tells the single-page app where its assets live, so the
#                     first stylesheet request is /argocd/assets/... and not
#                     /assets/....
#
# Nothing rewrites the URI at the gateway. A rewrite fixes the first request and
# nothing the page then asks for; the component that renders a link is the
# component that has to know its own address.
###############################################################################
configs:
  params:
    server.insecure: true
    server.rootpath: /argocd
    server.basehref: /argocd

notifications:
  enabled: true

  # Used by {{.context.argocdUrl}} in the templates below — the address a
  # developer clicks in a Slack message. Real since Phase 10: it is the
  # gateway's, not a port-forward's, so it works without anything running in a
  # terminal. The host port comes from kind-config.yaml, and a Go test fails if
  # this line and that file stop agreeing.
  argocdUrl: http://localhost:8080/argocd

  #--------------------------------------------------------------------------
  # Services — where a message can be delivered.
  #
  # endurance-sink is a plain JSON receiver inside the cluster. It exists so
  # that notifications are verifiable on a laptop with no Slack workspace, no
  # bot token and no internet account: deploy the sink, subscribe an app to it,
  # and `kubectl logs` shows the exact payload ArgoCD produced.
  #
  # Slack lives in values.slack.yaml (not committed) — see
  # values.slack.yaml.example. It is separate because a token or an
  # incoming-webhook URL is a credential, and a credential does not belong in a
  # file that is pushed to GitHub.
  #--------------------------------------------------------------------------
  notifiers:
    service.webhook.endurance-sink: |
      url: http://endurance-notify-sink.argocd.svc.cluster.local:8080
      headers:
      - name: Content-Type
        value: application/json

  #--------------------------------------------------------------------------
  # Templates — what a message says.
  #
  # Each template carries a body for every service shape the platform supports,
  # and ArgoCD uses whichever one matches the service the subscription named.
  # Every message states which half of the platform produced it, because a
  # developer reading their phone at 2am should not have to work out whether
  # "catalog v2" means "asked for" or "running".
  #--------------------------------------------------------------------------
  templates:
    template.endurance-deploying: |
      message: |
        Endurance · {{.app.metadata.name}} is deploying — ArgoCD is syncing revision {{if .app.status.sync.revisions}}{{index .app.status.sync.revisions 0}}{{end}}.
      webhook:
        endurance-sink:
          method: POST
          body: |
            {
              "stage": "deploying",
              "source": "argocd",
              "app": "{{.app.metadata.name}}",
              "namespace": "{{.app.spec.destination.namespace}}",
              "sync": "{{.app.status.sync.status}}",
              "health": "{{.app.status.health.status}}",
              "revision": "{{if .app.status.sync.revisions}}{{index .app.status.sync.revisions 0}}{{end}}",
              "text": "Endurance - {{.app.metadata.name}} is deploying (ArgoCD is syncing)."
            }
        slack-incoming:
          method: POST
          body: |
            {"text": ":hourglass_flowing_sand: Endurance · *{{.app.metadata.name}}* is deploying — ArgoCD is syncing `{{if .app.status.sync.revisions}}{{index .app.status.sync.revisions 0}}{{end}}`."}
      slack:
        attachments: |
          [{
            "title": "{{.app.metadata.name}} — deploying",
            "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#4a90d9",
            "fields": [
              {"title": "Sync",     "value": "{{.app.status.sync.status}}",   "short": true},
              {"title": "Health",   "value": "{{.app.status.health.status}}", "short": true},
              {"title": "Revision", "value": "{{if .app.status.sync.revisions}}{{index .app.status.sync.revisions 0}}{{end}}", "short": false}
            ]
          }]

    template.endurance-healthy: |
      message: |
        Endurance · {{.app.metadata.name}} is deployed and healthy at revision {{if .app.status.sync.revisions}}{{index .app.status.sync.revisions 0}}{{end}}.
      webhook:
        endurance-sink:
          method: POST
          body: |
            {
              "stage": "healthy",
              "source": "argocd",
              "app": "{{.app.metadata.name}}",
              "namespace": "{{.app.spec.destination.namespace}}",
              "sync": "{{.app.status.sync.status}}",
              "health": "{{.app.status.health.status}}",
              "revision": "{{if .app.status.sync.revisions}}{{index .app.status.sync.revisions 0}}{{end}}",
              "text": "Endurance - {{.app.metadata.name}} is deployed and healthy."
            }
        slack-incoming:
          method: POST
          body: |
            {"text": ":white_check_mark: Endurance · *{{.app.metadata.name}}* is deployed and healthy at `{{if .app.status.sync.revisions}}{{index .app.status.sync.revisions 0}}{{end}}`."}
      slack:
        attachments: |
          [{
            "title": "{{.app.metadata.name}} — healthy",
            "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#18be52",
            "fields": [
              {"title": "Sync",     "value": "{{.app.status.sync.status}}",   "short": true},
              {"title": "Health",   "value": "{{.app.status.health.status}}", "short": true},
              {"title": "Revision", "value": "{{if .app.status.sync.revisions}}{{index .app.status.sync.revisions 0}}{{end}}", "short": false}
            ]
          }]

    template.endurance-failed: |
      message: |
        Endurance · {{.app.metadata.name}} FAILED — sync {{.app.status.sync.status}}, health {{.app.status.health.status}}.
      webhook:
        endurance-sink:
          method: POST
          body: |
            {
              "stage": "failed",
              "source": "argocd",
              "app": "{{.app.metadata.name}}",
              "namespace": "{{.app.spec.destination.namespace}}",
              "sync": "{{.app.status.sync.status}}",
              "health": "{{.app.status.health.status}}",
              "revision": "{{if .app.status.sync.revisions}}{{index .app.status.sync.revisions 0}}{{end}}",
              "text": "Endurance - {{.app.metadata.name}} FAILED (sync {{.app.status.sync.status}}, health {{.app.status.health.status}})."
            }
        slack-incoming:
          method: POST
          body: |
            {"text": ":x: Endurance · *{{.app.metadata.name}}* failed — sync `{{.app.status.sync.status}}`, health `{{.app.status.health.status}}`."}
      slack:
        attachments: |
          [{
            "title": "{{.app.metadata.name}} — failed",
            "title_link": "{{.context.argocdUrl}}/applications/{{.app.metadata.name}}",
            "color": "#e01e5a",
            "fields": [
              {"title": "Sync",     "value": "{{.app.status.sync.status}}",   "short": true},
              {"title": "Health",   "value": "{{.app.status.health.status}}", "short": true},
              {"title": "Revision", "value": "{{if .app.status.sync.revisions}}{{index .app.status.sync.revisions 0}}{{end}}", "short": false}
            ]
          }]

  #--------------------------------------------------------------------------
  # Triggers — when a message is worth sending.
  #
  # These four names are the contract Endurance's notify.stages compiles to:
  #
  #   deploying  ->  on-sync-running
  #   healthy    ->  on-deployed
  #   failed     ->  on-health-degraded  AND  on-sync-failed
  #
  # `failed` maps to two because an application has two distinct ways to fail:
  # the sync can error, or the sync can succeed onto a workload that then goes
  # Degraded. Subscribing to only one is how a CrashLoopBackOff goes unreported.
  #
  # on-deployed carries `oncePer: revision` so a healthy application that ArgoCD
  # re-reconciles every three minutes does not notify anyone every three
  # minutes. Without it the first useful message would train everyone to ignore
  # the channel by the end of the afternoon.
  #
  # It keys on `revisions[0]`, not `revision`. Endurance's Applications are
  # multi-source (the chart + a `$values` source), and for a multi-source app
  # ArgoCD populates `status.sync.revisions` (plural) and leaves
  # `status.sync.revision` (singular) empty. Keying oncePer on the empty
  # singular field made it dedupe on `<nil>` — so `on-deployed` fired exactly
  # once, ever, and every later deploy was silently suppressed. Same reason the
  # templates read `revisions[0]`.
  #--------------------------------------------------------------------------
  triggers:
    trigger.on-sync-running: |
      - description: A sync has started
        when: app.status.operationState != nil and app.status.operationState.phase in ['Running']
        send: [endurance-deploying]

    trigger.on-deployed: |
      - description: The application is synced and healthy
        when: app.status.operationState != nil and app.status.operationState.phase in ['Succeeded'] and app.status.health.status == 'Healthy'
        oncePer: app.status.sync.revisions[0]
        send: [endurance-healthy]

    trigger.on-health-degraded: |
      - description: The application has degraded
        when: app.status.health.status == 'Degraded'
        send: [endurance-failed]

    trigger.on-sync-failed: |
      - description: The sync itself failed
        when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
        send: [endurance-failed]
