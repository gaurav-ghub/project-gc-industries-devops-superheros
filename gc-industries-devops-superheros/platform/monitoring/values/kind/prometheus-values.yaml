###############################################################################
# Serving the observability stack from subpaths (Phase 10 — the access layer)
#
# Grafana, Prometheus and Alertmanager are reached through the platform's Istio
# ingress gateway at http://localhost:8080/{grafana,prometheus,alertmanager}.
#
# Each is told its own address rather than having its URI rewritten at the
# gateway. A UI served at / and reached at /grafana answers the first request
# correctly and then asks the browser for /public/build/app.js, which is not a
# path the gateway routes anywhere — so the page loads unstyled and empty and
# looks like a broken cluster. Rewriting fixes exactly one request. Telling the
# component where it lives fixes all of them.
#
# The host port in these URLs comes from kind-config.yaml; a Go test fails if
# they stop agreeing.
###############################################################################

grafana:
  persistence:
    enabled: false

  grafana.ini:
    server:
      domain: localhost
      root_url: "http://localhost:8080/grafana"
      # Without this Grafana knows its public URL and still serves its assets
      # from /, which is the half-configured state that looks like a Grafana bug.
      serve_from_sub_path: true

  # serve_from_sub_path moves *everything* under /grafana, including
  # /api/health — which is where the chart's probes point. Left alone, Grafana
  # comes up, serves perfectly, fails both probes on a 404 and is killed and
  # restarted forever. The monitoring module would report a broken Grafana and
  # the fault would be in this file.
  readinessProbe:
    httpGet:
      path: /grafana/api/health
      port: 3000
  livenessProbe:
    httpGet:
      path: /grafana/api/health
      port: 3000
    initialDelaySeconds: 60
    timeoutSeconds: 30
    failureThreshold: 10

prometheus:
  prometheusSpec:
    replicas: 1
    # routePrefix changes what the pod serves; externalUrl changes the links it
    # generates (alert "Source" links, most visibly). Both, or an alert in Slack
    # points at an address nothing answers.
    routePrefix: /prometheus
    externalUrl: http://localhost:8080/prometheus

alertmanager:
  alertmanagerSpec:
    replicas: 1
    routePrefix: /alertmanager
    externalUrl: http://localhost:8080/alertmanager

  # Platform alert routing lives in the MAIN Alertmanager config so it is always
  # consumed. NOTE: the active installer (platform/monitoring/prometheus/
  # install.sh) passes ONLY this env values file, never values/base — so the
  # route has to be here, not in base. An AlertmanagerConfig CR
  # (infra/monitoring/alertmanager-config.yaml) would only be merged if the stack
  # were told to select it (alertmanagerConfigSelector), which it is not; that CR
  # was inert. The main config avoids that whole "looks wired, isn't" class.
  #
  # Phase 13 postscript: it avoided that class *here*, and the class recurred one
  # hop upstream. The PrometheusRule that produces the alerts this route carries
  # was applied by nothing at all until Phase 13 — see
  # infra/monitoring/rules/application-alerts.yaml and the ArgoCD Application
  # that now syncs it. Being green at every link except the first is
  # indistinguishable, from inside, from working.
  #
  # Alertmanager holds NO Slack or model credential. It only forwards matching
  # alerts to the in-cluster AI enricher (platform/ai), which enriches via OpenAI
  # and posts to Slack. Everything else (including the always-on Watchdog) goes to
  # the null receiver.
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      receiver: 'null'
      routes:
        - receiver: 'ai-webhook'
          matchers:
            - 'severity="warning"'
            - 'team="platform"'
          continue: false
    receivers:
      - name: 'null'
      - name: 'ai-webhook'
        webhook_configs:
          - url: 'http://superhero-ai-alertmanager.monitoring.svc.cluster.local:8000/alerts'
            send_resolved: true

    # PodContainerNotReady's own annotation says "no more specific alert
    # explained why" — and until this block existed, that sentence was an
    # intention, not a mechanism: the expression contains no inhibition
    # against the four specific rules above it, so both fired for the same
    # pod (B4, Phase 13's live run). Two Slack messages and two OpenAI calls
    # for one ImagePullBackOff.
    #
    # An inhibit_rule is Alertmanager's job, not PromQL's: keyed on the labels
    # every rule in infra/monitoring/rules/application-alerts.yaml carries
    # (namespace, pod), so a firing ImagePullFailing/ContainerCrashLooping/
    # ContainerOOMKilled/PodRestartingFrequently suppresses the backstop for
    # that exact pod and lets it through for every other one. Adding a sixth
    # specific alert to that file means adding its name here too —
    # cli/internal/platform/alerts_test.go reads both files and fails if they
    # disagree, the same way TestEveryAlertCarriesTheLabelsAlertmanagerRoutesOn
    # already does for the route matchers.
    inhibit_rules:
      - source_matchers:
          - 'alertname=~"ImagePullFailing|ContainerCrashLooping|ContainerOOMKilled|PodRestartingFrequently"'
        target_matchers:
          - 'alertname="PodContainerNotReady"'
        equal: ['namespace', 'pod']