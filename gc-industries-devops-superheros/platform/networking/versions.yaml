###############################################################################
# Endurance
# Networking Component Versions
#
# This file contains the versions of all networking components managed
# by the platform.
#
# Update versions here instead of modifying installation scripts.
#
# ---------------------------------------------------------------------------
# This file is READ by platform/networking/istio/install.sh, which refuses to
# install when the istioctl on PATH is a different version.
#
# It did not used to be. Until Phase 5 it declared istio 1.28.0 while the
# cluster ran 1.23.1, because the installer ran a bare `istioctl install` and
# the installed version was therefore whatever happened to be on the operator's
# PATH. A version file nobody reads is documentation, not configuration — and
# documentation that is wrong is worse than none.
#
# istioctl installs the control plane bundled with itself, so this file cannot
# *choose* a version; it can only insist that the operator's istioctl is the
# one the platform was verified against. To move Istio, download the matching
# istioctl and change the number here in the same commit.
# ---------------------------------------------------------------------------
###############################################################################

istio:
  # Verified in kind: control plane docker.io/istio/pilot:1.23.1, sidecar
  # docker.io/istio/proxyv2:1.23.1. networking.istio.io/v1 — used by the canary
  # VirtualService and DestinationRule in charts/app — has been available since
  # Istio 1.22.
  version: "1.23.1"

# Kiali moved out of this file in Phase 10.
#
# It used to be declared here, marked `installed: false`, as the version to use
# if a Kiali module were ever written. One was: platform/access/, which installs
# it alongside the ingress Gateway and the platform's routes, because Kiali is
# something you reach rather than something the mesh needs. Its version lives in
# platform/access/versions.yaml, which is the file its installer reads —
# declaring it in two places is how the Istio number came to be wrong for
# months.

# The ingress gateway's host-facing ports are not here either. They are the
# nodePorts in istio/kind-gateway.yaml, paired with the hostPorts in
# kind-config.yaml; a Go test reads both files and fails if they disagree.
