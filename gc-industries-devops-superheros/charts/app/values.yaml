# Default values for the Endurance generic app chart.
# Endurance generates a per-application values file (apps/<name>/values.yaml)
# that overrides these. The shape:
#
# app:
#   name: superheros
# services:
#   - name: frontend
#     image: docker.io/dockergc00/superheros-frontend
#     tag: v1-9c6f729
#     port: 8080
#     replicas: 1
#     resources: { requests: {...}, limits: {...} }   # optional
#     security:  { runAsNonRoot: true, ... }          # optional
#     env:       [ { name: X, value: "y" } ]          # optional
#     versions:                                       # optional — canary
#       - { name: v1, tag: v1-abc, weight: 90, replicas: 1, env: [...] }
#       - { name: v2, tag: v2-def, weight: 10, replicas: 1, env: [...] }

app:
  name: app

# Istio. On by default since Phase 13.
#
# It was off, and the argument for off was real: a sidecar is not free, and
# turning the mesh on rolls every pod in the namespace. The problem was that
# neither interactive form asked, so the only way to switch it on was to
# hand-write `mesh: {enabled: true}` into a spec file — which specs/superheros.yaml
# does and nothing a user onboarded ever did. The platform installed Istio,
# installed Kiali to look at Istio, routed every request through the Istio
# ingress gateway, and put every application outside the mesh. The first outside
# run deployed three applications and all of their pods were 1/1.
#
# A service that declares `versions` needs the mesh outright: the weights are
# enforced by Envoy, and with mesh off they are inert while still looking
# configured. Endurance warns when it sees that combination.
#
# Set false to opt out — `endurance init --no-mesh`, or the mesh question in
# either form. Endurance always writes this key explicitly into
# apps/<name>/values.yaml, so the generated file states the answer rather than
# inheriting it from here.
mesh:
  enabled: true

# The application's public address, if it wants one.
#
# Off by default: most services in a multi-service application are internal, and
# exposing them by default would be a security decision made by omission. An
# application asks for a route in its own spec and Endurance renders it here —
# the chart never decides what an application's URL looks like.
#
#   route:
#     enabled: true
#     gateway: istio-system/endurance-gateway   # the platform's one Gateway
#     path: /                                   # a prefix on the platform's host
#     service: frontend                         # which service answers it
#     port: 80
route:
  enabled: false

# Fallbacks for a service that declares no resources/security of its own.
#
# Endurance-generated values files always spell both blocks out per service, so
# these are only reached by a hand-written values file. They are kept in sync
# with the constants in cli/internal/spec — a service must never render without
# them, because the require-resources and enforce-security-context policies in
# infra/kyverno_policy/ reject a pod that is missing either.
defaults:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  security:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    allowPrivilegeEscalation: false
    dropCapabilities:
      - ALL

# One entry per service. Each renders a Deployment + Service.
services: []
