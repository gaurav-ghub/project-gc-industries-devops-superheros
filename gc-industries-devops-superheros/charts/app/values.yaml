# Default values for the Endurance generic app chart.
# Endurance generates a per-application values file (apps/<name>/values.yaml)
# that overrides these. The shape:
#
# app:
#   name: superheros
# services:
#   - name: frontend
#     image: docker.io/dockergc00/superheros-frontend
#     tag: v1-9c6f729
#     port: 8080
#     replicas: 1
#     resources: { requests: {...}, limits: {...} }   # optional
#     security:  { runAsNonRoot: true, ... }          # optional
#     env:       [ { name: X, value: "y" } ]          # optional
#     versions:                                       # optional — canary
#       - { name: v1, tag: v1-abc, weight: 90, replicas: 1, env: [...] }
#       - { name: v2, tag: v2-def, weight: 10, replicas: 1, env: [...] }

app:
  name: app

# Istio. Off by default: switching it on gives every pod a sidecar (and rolls
# them all), which only earns its keep when something needs mesh-level routing.
# A service that declares `versions` needs exactly that — the weights are
# enforced by Envoy, and with mesh off they are inert while still looking
# configured. Endurance warns when it sees that combination.
mesh:
  enabled: false

# Fallbacks for a service that declares no resources/security of its own.
#
# Endurance-generated values files always spell both blocks out per service, so
# these are only reached by a hand-written values file. They are kept in sync
# with the constants in cli/internal/spec — a service must never render without
# them, because the require-resources and enforce-security-context policies in
# infra/kyverno_policy/ reject a pod that is missing either.
defaults:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi
  security:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    allowPrivilegeEscalation: false
    dropCapabilities:
      - ALL

# One entry per service. Each renders a Deployment + Service.
services: []
