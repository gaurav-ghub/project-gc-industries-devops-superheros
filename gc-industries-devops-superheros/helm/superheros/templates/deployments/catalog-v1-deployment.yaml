apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-v1
  namespace: {{ .Values.namespace.name }}
spec:
  replicas: {{ (index .Values.services.catalog.versions 0).replicas | default 1 }}
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: catalog
      version: v1
  template:
    metadata:
      labels:
        app: catalog
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: catalog
          image: "{{ .Values.image.registry }}/{{ (index .Values.services.catalog.versions 0).name }}:{{ (index .Values.services.catalog.versions 0).tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
          resources:
             {{- toYaml .Values.services.catalog.resources | nindent 12 }}
          env:
            - name: CATALOG_VERSION
              value: "v1"
            - name: TRAFFIC_WEIGHT
              value: "{{ (index .Values.services.catalog.versions 0).trafficWeight }}"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          
