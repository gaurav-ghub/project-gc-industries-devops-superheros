# Source: superheros/templates/deployments/catalog-v1-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-v1
  namespace: superheros
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: catalog
      version: v1
  template:
    metadata:
      labels:
        app: catalog
        version: v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: catalog
          image: "docker.io/dockergc00/superheros-catalog:v1-6f11a5d"
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          env:
            - name: CATALOG_VERSION
              value: "v1"
            - name: TRAFFIC_WEIGHT
              value: "40"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
