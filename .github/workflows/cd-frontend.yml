name: CD - Frontend (GitOps)

on:
  workflow_run:
    workflows: ["CI - Frontend"]
    types:
      - completed

jobs:
  update-helm:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout main
        run: |
          git checkout main
          git pull origin main

      - name: Set image tag
        run: |
          echo "TAG=v1-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Update Helm values
        run: |
          yq -i '.services.frontend.tag = env(TAG)' \
            gc-industries-devops-superheros/helm/superheros/values.yaml


      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "chore(cd): update frontend image ${TAG}" || echo "No changes"
          git pull --rebase origin main
          git push origin main