name: Policy Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Install Kyverno CLI
        run: |
          KYVERNO_VERSION=v1.11.0
          curl -LO https://github.com/kyverno/kyverno/releases/download/${KYVERNO_VERSION}/kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz
          tar -xvf kyverno-cli_${KYVERNO_VERSION}_linux_x86_64.tar.gz
          sudo mv kyverno /usr/local/bin/
          kyverno version

      - name: Render Helm templates
        run: |
          helm template superheros \
            gc-industries-devops-superheros/helm/superheros \
            > rendered.yaml

      - name: Run Kyverno validation
        run: |
          echo "🔍 Running Kyverno validation..."

          kyverno apply \
            gc-industries-devops-superheros/infra/kyverno_policy \
            --resource rendered.yaml \
            --policy-report > kyverno-report.txt || true

          echo ""
          echo "📊 ===== SUMMARY ====="

          grep "result:" kyverno-report.txt | sort | uniq -c || true

          echo ""
          echo "❌ FAILED:"
          grep -B 2 -A 3 "result: fail" kyverno-report.txt || echo "None 🎉"

      - name: Fail if violations found
        run: |
          if grep -q "result: fail" kyverno-report.txt; then
            echo "❌ Policy violations found"
            exit 1
          else
            echo "✅ All good"
          fi

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyverno-report
          path: kyverno-report.txt