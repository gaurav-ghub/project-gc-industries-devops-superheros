name: CD - Inventory (GitOps)

permissions:
  contents: write

on:
  workflow_run:
    workflows: ["CI - Inventory"]
    types:
      - completed

jobs:
  update-helm:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Checkout main
        run: |
          git checkout main
          git pull origin main

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - name: Set image tag
        run: |
          echo "TAG=v1-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Update Helm values
        run: |
          yq -i '.services.inventory.tag = env(TAG)' \
            gc-industries-devops-superheros/helm/superheros/values.yaml

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add gc-industries-devops-superheros/helm/superheros/values.yaml

          git diff --cached --quiet && echo "No changes to commit" && exit 0

          git commit -m "chore(cd): update inventory image ${TAG} [skip ci]"

          git pull --rebase origin main

          git push