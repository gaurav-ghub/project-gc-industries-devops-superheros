name: CI - Frontend (PR)

on:
  pull_request:
    branches:
      - main
    paths:
      - gc-industries-devops-superheros/superhero-app-code/frontend/**
      - gc-industries-devops-superheros/helm/**

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t test-frontend gc-industries-devops-superheros/superhero-app-code/frontend

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          image-ref: frontend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true # Ignore vulnerabilities that do not have a fix available
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'