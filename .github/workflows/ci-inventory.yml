name: CI - Inventory 

on:
  push:
    branches:
      - main
    paths:
      - gc-industries-devops-superheros/superhero-app-code/inventory/**
      - gc-industries-devops-superheros/helm/**
      - gc-industries-devops-superheros/infra/**

jobs:
  build-and-push:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Inventory Image
        run: |
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/superheros-inventory
          TAG=v1-${GITHUB_SHA::7}

          docker build -t $IMAGE:$TAG superhero-app-code/inventory
          docker push $IMAGE:$TAG