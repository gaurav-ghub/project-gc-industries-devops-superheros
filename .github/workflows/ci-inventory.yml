name: CI - Inventory

on:
  push:
    branches:
      - main
    paths:
      - gc-industries-devops-superheros/superhero-app-code/inventory/**
      #- gc-industries-devops-superheros/helm/**
      #- gc-industries-devops-superheros/infra/**

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Inventory Image
        run: |
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          echo "SHORT_SHA=$SHORT_SHA" >> $GITHUB_ENV
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/superheros-inventory
          TAG=v1-$SHORT_SHA

          docker build -t $IMAGE:$TAG gc-industries-devops-superheros/superhero-app-code/inventory
          docker push $IMAGE:$TAG

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@v0.2.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/superheros-inventory:v1-${{ env.SHORT_SHA }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'